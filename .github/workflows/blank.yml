name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          unzip -o mc1h-apk-decompiler.zip -d .
          ls -la mc1h-apk-decompiler

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: mc1h-apk-decompiler
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mc1h-apk-decompiler-debug
          path: mc1h-apk-decompiler/app/build/outputs/apk/debug/*.apk
